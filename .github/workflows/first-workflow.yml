name: My First Workflow

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build (branch + sha + v1)
        run: |
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          docker build \
            -t hello-world-nginx:${BRANCH} \
            -t hello-world-nginx:${SHA} \
            -t hello-world-nginx:v1 \
            .

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag and push to GHCR
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LC="${OWNER,,}"   # force lowercase namespace
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"

          docker tag hello-world-nginx:v1        ghcr.io/${OWNER_LC}/hello-world-nginx:v1
          docker tag hello-world-nginx:${BRANCH} ghcr.io/${OWNER_LC}/hello-world-nginx:${BRANCH}
          docker tag hello-world-nginx:${SHA}    ghcr.io/${OWNER_LC}/hello-world-nginx:${SHA}

          docker push ghcr.io/${OWNER_LC}/hello-world-nginx:v1
          docker push ghcr.io/${OWNER_LC}/hello-world-nginx:${BRANCH}
          docker push ghcr.io/${OWNER_LC}/hello-world-nginx:${SHA}

      - name: Run container (detached) and map port
        run: docker run -d --rm --name hello-nginx -p 8080:80 hello-world-nginx:v1

      - name: Smoke test (curl)
        run: |
          sleep 2
          curl -sSf http://localhost:8080 | tee curl_output.html
          head -n 1 curl_output.html

      - name: Stop container
        if: always()
        run: docker stop hello-nginx || true
      
      - name: Azure test – Get Compute
        uses: Azure/CLI@v2.1.0
        with:
          azcliversion: 2.64.0
          inlineScript: |
            az extension add --name ml
            az configure --defaults group=$GROUP workspace=$WORKSPACE location=$LOCATION
            az ml compute list
