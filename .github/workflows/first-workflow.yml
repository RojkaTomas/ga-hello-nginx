  name: My First Workflow

  on:
    workflow_dispatch: {}
    pull_request:
      branches: [ main ]
  permissions:
      contents: read
      packages: write

  jobs:
    build-and-smoke-test:
      # Start on GitHub's runner to keep it simple first
      runs-on: ubuntu-24.04

      steps:
        - name: Check out code repository
          uses: actions/checkout@v4

        - name: Set up Docker Buildx (optional but nice)
          uses: docker/setup-buildx-action@v3

        - name: Build image with branch and sha tags
          run: |
            BRANCH="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
            docker build \
              -t hello-world-nginx:${BRANCH} \
              -t hello-world-nginx:${SHA} \
              -t hello-world-nginx:v1 \
              .
        - name: Log in to GHCR
          run: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

        - name: Tag and push to GHCR
          run: |
            OWNER="${{ github.repository_owner }}"
            BRANCH="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
            docker tag hello-world-nginx:v1 ghcr.io/${OWNER}/hello-world-nginx:v1
            docker tag hello-world-nginx:${BRANCH} ghcr.io/${OWNER}/hello-world-nginx:${BRANCH}
            docker tag hello-world-nginx:${SHA} ghcr.io/${OWNER}/hello-world-nginx:${SHA}
            docker push ghcr.io/${OWNER}/hello-world-nginx:v1
            docker push ghcr.io/${OWNER}/hello-world-nginx:${BRANCH}
            docker push ghcr.io/${OWNER}/hello-world-nginx:${SHA}

        - name: Run container (detached) and map port
          run: |
            docker run -d --rm --name hello-nginx -p 8080:80 hello-world-nginx:v1

        - name: Smoke test (curl)
          run: |
            # Give Nginx a moment to start
            sleep 2
            curl -sSf http://localhost:8080 | tee curl_output.html
            # Show the first line for the "multi-line script" question
            head -n 1 curl_output.html

        - name: Stop container
          if: always()
          run: docker stop hello-nginx || true
        
      

